<div class="min-h-dvh touch-manipulation">
  @if (userManager.activeUser() !== null) {
    <div class="xl:pl-72">
      <main class="mx-auto w-full max-w-3xl px-4 pt-6 pb-32 xl:max-w-5xl xl:px-8 xl:pt-10">
        @if (isLoading()) {
          <app-loader />
        } @else {
          <router-outlet />
        }
      </main>
    </div>

    <app-app-nav />
  } @else {
    <main class="min-h-dvh">
      @if (isLoading()) {
        <app-loader />
      } @else {
        <router-outlet />
      }
    </main>
  }

  <app-ui-feedback-host />
</div>
