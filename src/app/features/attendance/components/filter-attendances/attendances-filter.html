<app-ui-disclosure [(expanded)]="expanded">
  <div header class="flex min-w-0 items-center gap-3">
    <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-primary-50 text-primary-600">
      <app-ui-icon name="sliders-horizontal" [size]="19" />
    </span>

    <div class="min-w-0">
      <p class="text-[15px] font-bold tracking-tight text-slate-800">Filtros</p>
      <p class="truncate text-xs text-slate-400">{{ summary() }}</p>
    </div>
  </div>

  <div class="flex flex-col gap-4 pt-1">
    <app-ui-field label="Equipo" fieldId="filter-team">
      <select id="filter-team" class="input" [ngModel]="selectedTeam()?.id ?? 0" (ngModelChange)="onTeamsChange($event)">
        <option value="0">Seleccionar equipo</option>
        @for (team of teams(); track team.id) {
          <option value="{{team.id}}">{{team.name}}</option>
        }
      </select>
    </app-ui-field>

    <app-ui-field label="Fecha" fieldId="filter-date">
      <input id="filter-date" type="date" class="input" [ngModel]="date()" (ngModelChange)="onDateChange($event)">
    </app-ui-field>

    <app-ui-field label="Tipo de asistencia">
      <app-ui-segmented
        [options]="typeOptions()"
        [value]="selectedAttendanceType().id"
        (valueChange)="onAttendanceTypeIdChange($event)"
      />
    </app-ui-field>
  </div>
</app-ui-disclosure>
