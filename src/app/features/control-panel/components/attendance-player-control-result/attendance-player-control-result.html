<article 
  class="flex flex-col p-2 border rounded-sm border-grey border-l-4 border-l-primary border-r-4 border-r-primary transition-all" 
  [class.border-l-primary-red]="!attendance().hasAttended"
  [class.border-r-primary-red]="!attendance().hasAttended"
>
  <div class="min-h-8 flex gap-8 justify-between items-center">
    <span class="font-semibold">{{attendance().date | date: 'dd/MM/yyyy'}}</span>
    <span>{{attendance().attendanceType.name}}</span>
    <span>{{attendance().team.name}}</span>
  </div>

  @if (!attendance().hasAttended) {
    <div class="min-h-8 flex gap-8 justify-between items-center">
      <span>{{attendance().reason?.name}}</span>
      <span>{{attendance().reasonDescription}}</span>
    </div>
  }
</article>
