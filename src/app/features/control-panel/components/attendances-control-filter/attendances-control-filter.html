<app-ui-disclosure [(expanded)]="expanded">
  <div header class="flex min-w-0 items-center gap-3">
    <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-primary-50 text-primary-600">
      <app-ui-icon name="sliders-horizontal" [size]="19" />
    </span>

    <div class="min-w-0">
      <p class="text-[15px] font-bold tracking-tight text-slate-800">Filtros</p>
      <p class="truncate text-xs text-slate-400">{{ summary() }}</p>
    </div>
  </div>

  <div class="flex flex-col gap-5 pt-1">
    @if (seasons().length > 1) {
      <app-ui-field label="Temporada" fieldId="ac-season">
        <select id="ac-season" class="input" [ngModel]="selectedSeason()?.id ?? ''" (ngModelChange)="onSeasonChange($event)">
          <option value="">Seleccionar temporada</option>
          @for (season of seasons(); track season.id) {
            <option value="{{season.id}}">{{season.name}}</option>
          }
        </select>
      </app-ui-field>
    }

    @if (selectedSeason()) {
      <app-ui-field label="Equipo" fieldId="ac-team">
        <select id="ac-team" class="input" [ngModel]="selectedTeam()?.id ?? 0" (ngModelChange)="onTeamsChange($event)">
          <option value="0">Seleccionar equipo</option>
          @for (team of teams(); track team.id) {
            <option value="{{team.id}}">{{team.name}}</option>
          }
        </select>
      </app-ui-field>

      <div
        class="flex items-center justify-between rounded-xl border border-line px-4 py-3 transition-colors"
        [class.bg-canvas]="selectedTeam() !== null"
        [class.bg-slate-50]="selectedTeam() === null"
        [class.border-dashed]="selectedTeam() === null"
      >
        <div class="min-w-0">
          <p
            class="text-sm font-semibold transition-colors"
            [class.text-slate-600]="selectedTeam() !== null"
            [class.text-slate-400]="selectedTeam() === null"
          >Rango de fechas</p>
          @if (selectedTeam() === null) {
            <p class="text-xs leading-none text-slate-400">Selecciona un equipo primero</p>
          }
        </div>

        <span class="flex items-center" [class.disabled]="selectedTeam() === null">
          <app-switch
            [value]="showEndDate()"
            (valueChange)="onShowEndDateChange($event)"
          />
        </span>
      </div>

      @if (!showEndDate()) {
        <app-ui-field label="Fecha" fieldId="ac-date">
          <input id="ac-date" type="date" class="input" [ngModel]="date()" (ngModelChange)="onDateChange($event)">
        </app-ui-field>
      } @else {
        <div class="grid grid-cols-1 gap-4 xs:grid-cols-2">
          <app-ui-field label="Desde" fieldId="ac-start">
            <input id="ac-start" type="date" class="input" [ngModel]="startDate()" (ngModelChange)="onStartDateChange($event)">
          </app-ui-field>

          <app-ui-field label="Hasta" fieldId="ac-end">
            <input id="ac-end" type="date" class="input" [ngModel]="endDate()" (ngModelChange)="onEndDateChange($event)">
          </app-ui-field>
        </div>
      }
    }
  </div>
</app-ui-disclosure>
