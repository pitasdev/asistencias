<div class="flex flex-col gap-1 lg:grid lg:grid-cols-2 lg:gap-3 xl:grid-cols-3">
  @for (attendanceSummary of attendancesSummary(); track attendanceSummary.team.id) {
    <button
      type="button"
      class="card card-hover group flex w-full items-center justify-between gap-3 px-4 py-3 text-left"
      (click)="clickTeam.emit(attendanceSummary.team)"
    >
      <p class="min-w-0 flex-1 truncate text-sm font-bold tracking-tight text-slate-800">{{attendanceSummary.team.name}}</p>

      <span class="flex shrink-0 items-center gap-2">
        <span class="flex items-center gap-1.5 rounded-full bg-positive-soft px-2.5 py-1 text-xs font-bold tabular-nums text-positive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="size-3"><path d="M20 6 9 17l-5-5"/></svg>
          {{attendanceSummary.attendanceTrue}}
        </span>

        <span class="flex items-center gap-1.5 rounded-full bg-negative-soft px-2.5 py-1 text-xs font-bold tabular-nums text-negative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="size-3"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          {{attendanceSummary.attendanceFalse}}
        </span>

        <app-ui-icon name="chevron-right" [size]="16" class="shrink-0 text-slate-300 transition-transform group-hover:translate-x-0.5 group-hover:text-primary-500" />
      </span>
    </button>
  }
</div>
