<app-ui-page-header title="Gestión de Equipos" subtitle="Organiza los equipos y su orden de visualización" [backLink]="'/panel-de-control'" />

<app-find-filter
  [searchPlaceholder]="'Buscar equipo…'"
  [buttonText]="'Añadir Equipo'"
  (searchTextChange)="filterTeams($event)"
  (buttonClick)="showAddTeamModal()"
/>

@if (teams().length > 0) {
  <section class="card divide-y divide-line" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (team of teams(); track team.id) {
      <div class="flex items-center gap-2 p-2 transition-colors first:rounded-t-2xl hover:bg-canvas/60 last:rounded-b-2xl sm:gap-3 sm:p-3 sm:px-4" cdkDrag>
        <button
          type="button"
          class="icon-btn size-8 shrink-0 cursor-grab touch-none active:cursor-grabbing"
          aria-label="Arrastrar para reordenar"
          cdkDragHandle
        >
          <app-ui-icon name="grip-vertical" [size]="16" />
        </button>

        <span class="w-6 shrink-0 text-center text-xs font-semibold tabular-nums text-slate-400">{{team.order}}</span>

        <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-primary-50 text-primary-600">
          <app-ui-icon name="shirt" [size]="18" />
        </span>

        <p class="min-w-0 flex-1 truncate text-[15px] font-semibold tracking-tight text-slate-800">{{team.name}}</p>

        <app-ui-menu
          [items]="teamMenuItems"
          label="Acciones del equipo"
          (select)="onTeamMenu($event, team)"
        />
      </div>
    }
  </section>
} @else {
  <section class="card">
    <app-ui-empty-state
      icon="shirt"
      title="Sin equipos"
      message="Crea el primer equipo del club con el botón «Añadir Equipo»."
    />
  </section>
}

@if (openModal()) {
  <app-modal
    [closeModal]="closeModal()"
    (modalClosed)="modalClosed()"
  >
    <div class="flex flex-col gap-5">
      <div>
        <h3 class="text-lg font-bold tracking-tight text-slate-900">{{modalTitle()}}</h3>
      </div>

      <form (submit)="modalType() === 'add' ? addTeam() : editTeam(); $event.preventDefault()" novalidate class="flex flex-col gap-4">
        <app-ui-field label="Nombre del equipo" fieldId="add-team" [error]="fieldError(teamForm.name())">
          <input id="add-team" type="text" class="input" placeholder="Ej.: Senior A" [formField]="teamForm.name">
        </app-ui-field>

        <div class="mt-2 grid grid-cols-2 gap-3">
          <app-button
            [text]="'Cancelar'"
            [width]="'full'"
            [color]="'cancel'"
            (click)="closeModal.set(true)"
          />

          @if (modalType() === 'add') {
            <app-button
              [text]="'Crear'"
              [width]="'full'"
              [type]="'submit'"
              [disabled]="!teamForm().valid()"
            />
          } @else if (modalType() === 'edit') {
            <app-button
              [text]="'Modificar'"
              [width]="'full'"
              [type]="'submit'"
              [disabled]="!teamForm().valid()"
            />
          }
        </div>
      </form>
    </div>
  </app-modal>
}

@if (openDeleteModal()) {
  <app-confirm-modal
    [text]="deleteModalText()"
    [title]="'Eliminar Equipo'"
    [buttonColor]="'red'"
    (selectedOption)="confirmOptionSelected($event)"
    (closedModal)="openDeleteModal.set(false)"
  />
}
