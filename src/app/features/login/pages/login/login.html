<section class="flex min-h-dvh w-full items-center justify-center bg-canvas px-5 py-10">
  <div class="animate-rise-in w-full max-w-sm">
    <div class="card p-6 md:p-8">
      <div class="mb-6 flex flex-col items-center text-center">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-4 size-14">
        <rect width="24" height="24" rx="7" fill="#155dfc" />
        <path d="M6.5 12.5l3.4 3.4L17.5 8.8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Bienvenido de nuevo</h1>
      <p class="mt-1.5 text-sm text-slate-400">Ingresa tus credenciales para acceder a tu cuenta</p>
    </div>

    <form (submit)="login(); $event.preventDefault()" novalidate class="flex flex-col gap-4">
      <app-ui-field label="Usuario" fieldId="username" [error]="fieldError(loginForm.username())">
        <div class="flex h-11 items-center gap-2.5 rounded-xl border border-line bg-white px-3.5 shadow-inset-field transition-all duration-150 focus-within:border-primary-400 focus-within:ring-4 focus-within:ring-primary-600/12"
          [class.input-invalid]="loginForm.username().touched() && loginForm.username().invalid()">
          <app-ui-icon name="user" [size]="17" class="text-slate-300" />
          <input id="username" type="text" autocomplete="username" placeholder="Tu usuario"
            class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400 focus-visible:outline-none"
            [formField]="loginForm.username">
        </div>
      </app-ui-field>

      <app-ui-field label="Contraseña" fieldId="password">
        <div
          class="flex h-11 items-center gap-2.5 rounded-xl border border-line bg-white px-3.5 shadow-inset-field transition-all duration-150 focus-within:border-primary-400 focus-within:ring-4 focus-within:ring-primary-600/12"
          [class.input-invalid]="loginForm.password().touched() && loginForm.password().invalid()">
          <app-ui-icon name="lock" [size]="17" class="text-slate-300" />

          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400 focus-visible:outline-none"
            [formField]="loginForm.password"
          >

          <button type="button" class="-mr-1 icon-btn size-9" [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="showPassword.set(!showPassword())">
            <app-ui-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="17" />
          </button>
        </div>
      </app-ui-field>

      <label class="flex w-fit cursor-pointer select-none items-center gap-2.5 pt-1">
        <input #rememberMeCheckbox type="checkbox" id="remember-me"
          class="size-[18px] cursor-pointer rounded accent-primary-600"
          [checked]="rememberMe()"
          (click)="rememberMe.set(!rememberMe())">

        <span class="text-sm font-semibold text-slate-600">Recordarme</span>
      </label>

      <app-button
        class="w-full mt-2"
        [text]="'Iniciar Sesión'"
        [width]="'full'"
        [type]="'submit'"
        [loading]="submitting()"
        [disabled]="!loginForm().valid()"
      />
      </form>
    </div>
  </div>
</section>
