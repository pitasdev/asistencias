<app-ui-disclosure [(expanded)]="expanded">
  <div header class="flex min-w-0 items-center gap-3">
    <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-primary-50 text-primary-600">
      <app-ui-icon name="sliders-horizontal" [size]="19" />
    </span>

    <div class="min-w-0">
      <p class="text-[15px] font-bold tracking-tight text-slate-800">Filtros</p>
      <p class="truncate text-xs text-slate-400">{{ summary() }}</p>
    </div>
  </div>

  <div class="flex flex-col gap-5 pt-1">
    @if (showSeasonSelector()) {
      <app-ui-field label="Temporada" fieldId="stats-season">
        <select id="stats-season" class="input" [ngModel]="selectedSeason()?.name ?? ''" (ngModelChange)="onSeasonChange($event)">
          <option value="">Seleccionar temporada</option>
          @for (season of seasons(); track season.name) {
            <option value="{{season.name}}">{{season.name}}</option>
          }
        </select>
      </app-ui-field>
    }

    @if (selectedSeason()) {
      <app-ui-field label="Equipo" fieldId="stats-team">
        <select id="stats-team" class="input" [ngModel]="selectedTeam()?.id ?? 0" (ngModelChange)="onTeamChange($event)">
          <option value="0">Seleccionar equipo</option>
          @for (team of teams(); track team.id) {
            <option value="{{team.id}}">{{team.name}}</option>
          }
        </select>
      </app-ui-field>
    }

    @if (selectedTeam()) {
      <app-ui-field label="Jugador" fieldId="stats-player">
        <select id="stats-player" class="input" [ngModel]="selectedPlayer()?.id ?? 0" (ngModelChange)="onPlayerChange($event)">
          <option value="0">Seleccionar jugador</option>
          @for (player of players(); track player.id) {
            <option value="{{player.id}}">{{player.name}} {{player.lastName}}</option>
          }
        </select>
      </app-ui-field>
    }
  </div>
</app-ui-disclosure>
