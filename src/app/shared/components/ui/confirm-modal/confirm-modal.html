<app-modal
  [closeModal]="closeModal()"
  (modalClosed)="closedModal.emit()"
>
  <div class="flex flex-col items-center gap-5 text-center">
    <div
      class="mt-1 flex size-14 items-center justify-center rounded-2xl"
      [class.bg-negative-soft]="buttonColor() === 'red'"
      [class.text-negative]="buttonColor() === 'red'"
      [class.bg-primary-50]="buttonColor() !== 'red'"
      [class.text-primary-600]="buttonColor() !== 'red'"
    >
      <app-ui-icon [name]="icon()" [size]="26" />
    </div>

    <div class="flex flex-col gap-2">
      @if (title()) {
        <h3 class="text-lg font-bold tracking-tight text-slate-900">{{ title() }}</h3>
      }

      <p class="text-[15px] leading-relaxed text-slate-500"><ng-content /></p>
    </div>

    <div class="mt-2 grid w-full grid-cols-2 gap-3">
      <app-button
        [text]="'Cancelar'"
        [width]="'full'"
        [color]="'cancel'"
        (click)="selectOption(false)"
      />

      <app-button
        [text]="'Confirmar'"
        [width]="'full'"
        [color]="buttonColor()"
        (click)="selectOption(true)"
      />
    </div>
  </div>
</app-modal>
